name: stock_for_ml
description: "Stock & profitability manager for MercadoLibre."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  core_models:
    path: ../../packages/core_models
  drift: 2.20.0
  drift_flutter: 0.2.0
  connectivity_plus: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.20.0
  build_runner: ^2.5.4

dependency_overrides:
  # device_info_plus 12.4.0 tiene un bug iOS (selector isiOSAppOnVision).
  # Se fuerza una versión previa estable para desbloquear el archive en CI.
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true
