name: CI

on:
  push:
    branches: [production, staging]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.7
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test core_models
        working-directory: packages/core_models
        run: dart test
      - name: Test app
        working-directory: apps/mobile
        run: flutter test

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test functions
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --no-check

  database:
    name: Supabase pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
