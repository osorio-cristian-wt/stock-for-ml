name: iOS · TestFlight

# Deploys the iOS app to TestFlight.
# Trigger manually (workflow_dispatch) or by pushing a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # App Store Connect API key (recommended over Apple ID login).
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }} # base64 of the .p8
      # fastlane match (code signing certs stored in a private git repo).
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.7
          channel: stable
          cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Resolve Flutter workspace
        run: flutter pub get

      # Generates ios/Flutter/Generated.xcconfig and compiles Dart so gym can archive.
      - name: Build Flutter iOS (no codesign)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/ios

      - name: fastlane beta (build + upload)
        working-directory: apps/mobile/ios
        run: bundle exec fastlane beta
        env:
          # Use the GitHub run number as the TestFlight build number.
          BUILD_NUMBER: ${{ github.run_number }}
